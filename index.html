
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLAYVERSE</title>
<style>
body{margin:0;background:#090b18;color:white;font-family:Arial;text-align:center}
header{padding:18px;background:#17172c;color:#43e7ff;font-size:28px;font-weight:bold}
h2{margin:12px}
canvas{width:95%;max-width:600px;background:#10152a;border:2px solid #43e7ff;border-radius:12px;touch-action:none}
button{padding:15px;margin:6px;border:0;border-radius:10px;background:#43e7ff;font-size:18px;font-weight:bold}
p{color:#d7d9e8}
</style>
</head>
<body>
<header>🎮 PLAYVERSE</header>
<h2>🦘 Neon Jumper</h2>
<p>Jump over the red obstacles and collect points!</p>
<canvas id="c" width="600" height="400"></canvas>
<h3 id="score">Score: 0</h3>
<button id="left">⬅️</button>
<button id="jump">⬆️ JUMP</button>
<button id="right">➡️</button>
<br><button onclick="restart()">🔄 Restart</button>
<script>
const c=document.getElementById("c"),x=c.getContext("2d");
let p,obs,score,over,keys,frame;
function restart(){
p={x:100,y:300,vy:0};obs=[];score=0;over=false;keys={};frame=0;
document.getElementById("score").textContent="Score: 0";
}
function down(k,v){keys[k]=v}
function bind(id,k){
let b=document.getElementById(id);
b.onpointerdown=e=>{e.preventDefault();down(k,true)};
b.onpointerup=b.onpointerleave=b.onpointercancel=()=>down(k,false);
}
bind("left","left");bind("right","right");bind("jump","jump");
document.onkeydown=e=>{
if(["ArrowLeft","ArrowRight","ArrowUp"," "].includes(e.key))e.preventDefault();
if(e.key==="ArrowLeft")down("left",true);
if(e.key==="ArrowRight")down("right",true);
if(e.key==="ArrowUp"||e.key===" ")down("jump",true);
};
document.onkeyup=e=>{
if(e.key==="ArrowLeft")down("left",false);
if(e.key==="ArrowRight")down("right",false);
if(e.key==="ArrowUp"||e.key===" ")down("jump",false);
};
function draw(){
x.clearRect(0,0,600,400);
x.fillStyle="#10152a";x.fillRect(0,0,600,400);
x.fillStyle="#43e7ff";x.fillRect(0,350,600,8);
x.font="32px Arial";x.fillText("🦘",p.x,p.y+30);
x.font="26px Arial";
obs.forEach(o=>x.fillText("🟥",o.x,o.y+25));
x.fillStyle="white";x.font="18px Arial";x.fillText("Score: "+score,15,25);
if(over){x.fillStyle="#ff4fd8";x.font="bold 38px Arial";x.fillText("GAME OVER!",170,180);x.font="20px Arial";x.fillText("Tap Restart to play again",170,220)}
}
function step(){
if(!over){
frame++;
if(keys.left)p.x-=5;if(keys.right)p.x+=5;
p.x=Math.max(0,Math.min(560,p.x));
if(keys.jump&&p.y>=300)p.vy=-13;
p.vy+=0.65;p.y+=p.vy;
if(p.y>300){p.y=300;p.vy=0}
if(frame%65===0)obs.push({x:610,y:320});
obs.forEach(o=>o.x-=5);
obs=obs.filter(o=>o.x>-40);
for(let o of obs){
if(p.x+28>o.x+3&&p.x<o.x+28&&p.y+28>o.y){over=true}
}
if(frame%10===0)score++;
document.getElementById("score").textContent="Score: "+score;
}
draw();requestAnimationFrame(step);
}
restart();step();
</script>
</body>
</html>
